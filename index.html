<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tes aim lo - skt X gmn Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; text-align: center;
            user-select: none;
        }
        
        /* Judul Kolaborasi yang Jelas dan Terpampang Nyata */
        .judul-utama { font-size: 28px; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .judul-utama span { color: #f1c40f; font-weight: 900; letter-spacing: 1px; }
        .instruksi { font-size: 14px; color: #bdc3c7; margin-bottom: 25px; }
        
        /* Area Game Kantor dengan Detail Background */
        .game-area {
            position: relative; width: 100%; max-width: 600px; height: 350px;
            background: linear-gradient(to bottom, 
                #d2b48c 0%, #e6d7c3 70%, 
                #8b5a2b 70%, #a0522d 72%, 
                #cd853f 72%, #deb887 100%
            );
            border: 6px solid #5c3a21; border-radius: 12px; margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); overflow: hidden;
        }

        /* Detail Background Jendela */
        .game-area::before {
            content: ""; position: absolute; top: 30px; left: 40px;
            width: 80px; height: 100px; background: rgba(255, 255, 255, 0.25);
            border: 3px solid #fff; border-radius: 4px; opacity: 0.4; pointer-events: none;
        }

        /* Detail Background Pajangan Dinding */
        .game-area::after {
            content: "🖼️"; position: absolute; top: 40px; right: 60px;
            font-size: 30px; opacity: 0.35; pointer-events: none;
        }
        
        /* Elemen Utama Game */
        .sampah { 
            position: absolute; bottom: 35px; left: 60px; font-size: 45px; 
            z-index: 10; transform-origin: center;
        }
        .tong-sampah { position: absolute; bottom: 35px; right: 70px; font-size: 55px; z-index: 5; }
        
        /* Garis Bidik */
        .aim-line {
            position: absolute; bottom: 60px; left: 85px;
            width: 120px; height: 3px; border-top: 3px dashed #e74c3c;
            transform-origin: left center; transform: rotate(-45deg);
            z-index: 2; pointer-events: none;
        }

        /* Elemen Efek Gangguan */
        .efek-gangguan {
            position: absolute; font-size: 70px; opacity: 0; z-index: 15;
            transition: all 0.4s ease-out; pointer-events: none;
        }

        /* Tombol Kontrol */
        .btn-lempar {
            background: #2ecc71; color: white; border: none; padding: 15px 50px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s;
        }
        .btn-lempar:hover { background: #27ae60; }
        .btn-lempar:active { transform: scale(0.95); }

        /* Pop-up Pesan */
        .notifikasi {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9); padding: 20px 40px; border-radius: 15px;
            font-size: 22px; font-weight: bold; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid #fff;
        }
        .notifikasi.muncul { transform: translate(-50%, -50%) scale(1); }
        .sukses { color: #2ecc71; border-color: #2ecc71; }
        .gagal { color: #e74c3c; border-color: #e74c3c; }
    </style>
</head>
<body>

    <h1 class="judul-utama">Tes Aim Buang Sampah Lu   [ <span>skt X gmn</span> ] 🎯</h1>
    <p class="instruksi">Paskan bidikan lalu klik tombol di bawah untuk melempar!</p>

    <div class="game-area">
        <div id="aimLine" class="aim-line"></div>
        <div id="itemSampah" class="sampah">🍎</div>
        <div id="itemTong" class="tong-sampah">🗑️</div>
        <div id="efekVisual" class="efek-gangguan"></div>
    </div>

    <button id="tombolLempar" class="btn-lempar" onclick="tembakSampah()">LEMPAR SEKARANG!</button>
    <div id="kotakNotif" class="notifikasi"></div>

    <script>
        const sampah = document.getElementById('itemSampah');
        const tong = document.getElementById('itemTong');
        const aimLine = document.getElementById('aimLine');
        const tombol = document.getElementById('tombolLempar');
        const notif = document.getElementById('kotakNotif');
        const efekVisual = document.getElementById('efekVisual');

        let sudutSekarang = -10; let arahGerak = -2.5; let animasiBidikan; let sedangBermain = true;

        function gerakkanAim() {
            if (!sedangBermain) return;
            sudutSekarang += arahGerak;
            if (sudutSekarang <= -80 || sudutSekarang >= -10) { arahGerak = -arahGerak; }
            aimLine.style.transform = `rotate(${sudutSekarang}deg)`;
            animasiBidikan = requestAnimationFrame(gerakkanAim);
        }
        gerakkanAim();

        const kejadianGagal = [
            { 
                teks: "Gagal! Tiba-tiba ada badai pasir menyapu apelmu! 🌪️", 
                animasi: () => {
                    efekVisual.innerHTML = "🌪️"; efekVisual.style.left = "150px"; efekVisual.style.top = "80px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { 
                        sampah.style.transform = "translate(120px, -240px) rotate(540deg) scale(0.5)";
                    }, 100);
                }
            },
            { 
                teks: "Gagal! Tong sampahnya mendadak kabur terbang! 🕊️", 
                animasi: () => { tong.style.transform = "translateY(-170px) rotate(-15deg)"; }
            },
            { 
                teks: "Gagal! Gravitasi hilang, apel melayang bebas! 🚀", 
                animasi: () => { sampah.style.transform = "translate(180px, -260px)"; }
            },
            { 
                teks: "Gagal! Kucing oren menerkam tong sampah! 🐈", 
                animasi: () => {
                    efekVisual.innerHTML = "🐈"; efekVisual.style.right = "-40px"; efekVisual.style.bottom = "35px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { 
                        efekVisual.style.right = "140px"; tong.style.transform = "translateX(90px)";
                    }, 50);
                }
            },
            { 
                teks: "Gagal! Lemparan terlalu kuat menembus atap! 🌠", 
                animasi: () => { sampah.style.transform = "translate(300px, -330px) scale(0.1)"; }
            },
            { 
                teks: "Gagal! Apel terhisap masuk ke dalam portal gaib! 🌀", 
                animasi: () => {
                    efekVisual.innerHTML = "🌀"; efekVisual.style.left = "210px"; efekVisual.style.top = "120px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { sampah.style.transform = "translate(180px, -160px) scale(0)"; }, 150);
                }
            },
            { 
                teks: "Gagal! Hembusan angin kencang meniup balik apelnya! 💨", 
                animasi: () => {
                    efekVisual.innerHTML = "💨"; efekVisual.style.left = "260px"; efekVisual.style.top = "100px"; efekVisual.style.opacity = "1";
                    sampah.style.transform = "translate(80px, -100px)";
                }
            },
            { 
                teks: "Gagal! Petir menyambar menghancurkan tong sampah! ⚡", 
                animasi: () => {
                    efekVisual.innerHTML = "⚡"; efekVisual.style.right = "85px"; efekVisual.style.top = "60px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { tong.innerHTML = "💥"; efekVisual.style.opacity = "0"; }, 250);
                }
            },
            { 
                teks: "Gagal! Tangan mendadak kram, apel jatuh lemas! 🖐️", 
                animasi: () => { sampah.style.transform = "translate(40px, 15px) rotate(90deg)"; }
            },
            { 
                teks: "Gagal! Apelnya mendadak hidup menjadi burung lalu kabur! 🐦", 
                animasi: () => { 
                    setTimeout(() => {
                        sampah.innerHTML = "🐦"; 
                        sampah.style.transform = "translate(120px, -250px) scaleX(-1)";
                    }, 200);
                }
            },
            { 
                teks: "Gagal! Guncangan bumi membuat tong bergeser jauh! 🌍", 
                animasi: () => { tong.style.transform = "translateX(-180px)"; }
            },
            { 
                teks: "Gagal! Tikus kantor melompat dan mencuri apelmu! 🐀", 
                animasi: () => {
                    efekVisual.innerHTML = "🐀"; efekVisual.style.left = "220px"; efekVisual.style.bottom = "-50px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { 
                        efekVisual.style.bottom = "120px";
                        sampah.style.transform = "translate(180px, -160px) scale(0)";
                    }, 150);
                }
            }
        ];

        function resetGame() {
            sampah.style.transition = "none"; sampah.style.transform = "none"; sampah.style.opacity = "1"; sampah.innerHTML = "🍎";
            tong.style.transform = "none"; tong.innerHTML = "🗑️";
            efekVisual.style.transition = "none"; efekVisual.style.opacity = "0"; efekVisual.style.transform = "none";
            notif.className = "notifikasi"; 
            sedangBermain = true; aimLine.style.opacity = "1"; tombol.disabled = false;
            gerakkanAim();
        }

        function tembakSampah() {
            sedangBermain = false;
            cancelAnimationFrame(animasiBidikan);
            tombol.disabled = true;
            aimLine.style.opacity = "0";
            
            sampah.style.transition = "all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
            sampah.style.transform = "translate(180px, -160px) rotate(180deg)";

            setTimeout(() => {
                const angkaKeberuntungan = Math.floor(Math.random() * 100) + 1;

                if (angkaKeberuntungan <= 7) {
                    sampah.style.transform = "translate(390px, 0px) rotate(360deg)";
                    setTimeout(() => {
                        sampah.style.opacity = "0";
                        notif.innerText = "CONGRATULATIONS!";
                        notif.className = "notifikasi muncul sukses";
                        setTimeout(resetGame, 3000);
                    }, 400);
                } else {
                    const indexGagal = Math.floor(Math.random() * kejadianGagal.length);
                    const kejadian = kejadianGagal[indexGagal];
                    
                    sampah.style.transition = "all 0.4s ease-out";
                    efekVisual.style.transition = "all 0.4s ease-out";
                    
                    kejadian.animasi();
                    
                    setTimeout(() => {
                        notif.innerText = kejadian.teks;
                        notif.className = "notifikasi muncul gagal";
                        setTimeout(resetGame, 3800);
                    }, 350);
                }
            }, 450);
        }
    </script>
</body>
</html>
