<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Buang Sampah </title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; text-align: center;
            user-select: none;
        }
        h1 { font-size: 26px; margin-bottom: 5px; color: #f1c40f; }
        .instruksi { font-size: 14px; color: #bdc3c7; margin-bottom: 20px; }
        
        /* Area Lapangan Game */
        .game-area {
            position: relative; width: 100%; max-width: 600px; height: 350px;
            background: #34495e; border: 4px solid #7f8c8d; border-radius: 10px; margin-bottom: 20px;
        }
        
        /* Elemen Sampah */
        .sampah { 
            position: absolute; bottom: 20px; left: 60px; font-size: 45px; 
            z-index: 10; transform-origin: center;
        }
        
        /* Elemen Tong Sampah */
        .tong-sampah { position: absolute; bottom: 20px; right: 70px; font-size: 55px; z-index: 5; }
        
        /* Garis Bidikan (Aim Indicator) */
        .aim-line {
            position: absolute; bottom: 45px; left: 85px;
            width: 120px; height: 3px;
            border-top: 3px dashed #f1c40f;
            transform-origin: left center;
            transform: rotate(-45deg);
            z-index: 2;
            pointer-events: none;
        }

        /* Tombol Tahan & Lepas */
        .btn-lempar {
            background: #2ecc71; color: white; border: none; padding: 15px 50px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s;
        }
        .btn-lempar.active { background: #e74c3c; }

        /* Pop-up Efek Kejadian */
        .notifikasi {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9); padding: 20px 40px; border-radius: 15px;
            font-size: 22px; font-weight: bold; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid #fff;
        }
        .notifikasi.muncul { transform: translate(-50%, -50%) scale(1); }
        .sukses { color: #2ecc71; border-color: #2ecc71; }
        .gagal { color: #e74c3c; border-color: #e74c3c; }
    </style>
</head>
<body>

    <h1>Simulasi Buang Sampah (Pake Aim) 🎯🗑️</h1>
    <p class="instruksi">Klik / Tekan tombol di bawah saat garis bidikan mengarah ke tong sampah!</p>

    <div class="game-area">
        <div id="aimLine" class="aim-line"></div>
        <div id="itemSampah" class="sampah">🍎</div>
        <div id="itemTong" class="tong-sampah">🗑️</div>
    </div>

    <button id="tombolLempar" class="btn-lempar" onclick="tembakSampah()">TAP / KLIK UNTUK LEMPAR!</button>
    <div id="kotakNotif" class="notifikasi"></div>

    <script>
        const sampah = document.getElementById('itemSampah');
        const tong = document.getElementById('itemTong');
        const aimLine = document.getElementById('aimLine');
        const tombol = document.getElementById('tombolLempar');
        const notif = document.getElementById('kotakNotif');

        let sudutSekarang = -10;
        let arahGerak = -1.5; // Kecepatan naik turun bidikan
        let animasiBidikan;
        let sedangBermain = true;

        // Loop untuk menggerakkan garis bidik secara otomatis naik-turun
        function gerakkanAim() {
            if (!sedangBermain) return;
            
            sudutSekarang += arahGerak;
            // Batasi sudut bidikan (antara -80 derajat sampai -10 derajat)
            if (sudutSekarang <= -80 || sudutSekarang >= -10) {
                arahGerak = -arahGerak; // Balik arah gerak
            }
            aimLine.style.transform = `rotate(${sudutSekarang}deg)`;
            animasiBidikan = requestAnimationFrame(gerakkanAim);
        }

        // Mulai animasi bidikan di awal game
        gerakkanAim();

        // 12 Kejadian Gagal Ngeselin
        const kejadianGagal = [
            { teks: "Gagal! Tiba-tiba ada badai pasir dari antah berantah! 🌪️", aksi: () => sampah.style.transform = "translate(100px, -220px) rotate(720deg)" },
            { teks: "Gagal! Tong sampahnya tiba-tiba punya sayap dan terbang! 🕊️", aksi: () => tong.style.transform = "translateY(-160px)" },
            { teks: "Gagal! Gravitasi bumi mendadak hilang, sampah melayang ke atas! 🚀", aksi: () => sampah.style.transform = "translateY(-270px)" },
            { teks: "Gagal! Ada kucing oren lewat dan menggeser tong sampahnya! 🐈", aksi: () => tong.style.transform = "translateX(90px)" },
            { teks: "Gagal! Lemparan terlalu kuat, sampahnya menembus atmosfer! 🌠", aksi: () => sampah.style.transform = "translate(450px, -320px)" },
            { teks: "Gagal! Mendadak muncul portal gaib yang memindahkan sampah! 🌀", aksi: () => sampah.style.opacity = "0" },
            { teks: "Gagal! Angin sepoi-sepoi tapi kok niupnya kencang banget? 💨", aksi: () => sampah.style.transform = "translate(-30px, -80px)" },
            { teks: "Gagal! Tong sampahnya mendadak disambar petir dan hancur! ⚡", aksi: () => tong.innerHTML = "💥" },
            { teks: "Gagal! Tangan kamu tiba-tiba kram saat melempar! 🖐️", aksi: () => sampah.style.transform = "translateY(15px)" },
            { teks: "Gagal! Sampahnya malah berubah jadi burung lalu terbang kabur! 🐦", aksi: () => { sampah.innerHTML = "🐦"; sampah.style.transform = "translate(-100px, -200px)"; } },
            { teks: "Gagal! Bumi berputar terlalu cepat, tongnya geser sendiri! 🌍", aksi: () => tong.style.transform = "translateX(-170px)" },
            { teks: "Gagal! Tikus got mendadak muncul dan menangkap sampahmu! 🐀", aksi: () => sampah.style.transform = "translate(180px, 20px)" }
        ];

        function resetGame() {
            sampah.style.transition = "none";
            sampah.style.transform = "none"; 
            sampah.style.opacity = "1"; 
            sampah.innerHTML = "🍎";
            tong.style.transform = "none"; 
            tong.innerHTML = "🗑️";
            notif.className = "notifikasi"; 
            
            sedangBermain = true;
            aimLine.style.opacity = "1";
            tombol.disabled = false;
            gerakkanAim(); // Jalankan bidikan lagi
        }

        function tembakSampah() {
            sedangBermain = false; // Hentikan pergerakan garis bidik
            cancelAnimationFrame(animasiBidikan);
            tombol.disabled = true;
            aimLine.style.opacity = "0"; // Sembunyikan garis aim saat terbang
            
            // Berikan efek transisi lemparan terbang
            sampah.style.transition = "all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
            
            // Efek terbang awal mengikuti arah sudut bidikan terakhir pemain
            sampah.style.transform = "translate(150px, -150px) rotate(180deg)";

            setTimeout(() => {
                // Logika keberuntungan 7%
                const angkaKeberuntungan = Math.floor(Math.random() * 100) + 1;

                if (angkaKeberuntungan <= 7) {
                    // JIKA BERHASIL (7% Peluang) -> Sampah masuk mulus ke tong
                    sampah.style.transform = "translate(390px, 0px) rotate(360deg)";
                    setTimeout(() => {
                        sampah.style.opacity = "0";
                        notif.innerText = "CONGRATULATIONS!";
                        notif.className = "notifikasi muncul sukses";
                        setTimeout(resetGame, 3000);
                    }, 400);
                } else {
                    // JIKA GAGAL (93% Peluang) -> Aktifkan kejadian acak ngeselin
                    const indexGagal = Math.floor(Math.random() * kejadianGagal.length);
                    const kejadian = kejadianGagal[indexGagal];
                    
                    sampah.style.transition = "all 0.5s ease-out";
                    kejadian.aksi();
                    
                    notif.innerText = kejadian.teks;
                    notif.className = "notifikasi muncul gagal";
                    setTimeout(resetGame, 3500);
                }
            }, 450);
        }
    </script>
</body>
</html>
