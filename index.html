<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Buang Sampah Ngeselin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; text-align: center;
        }
        h1 { font-size: 28px; margin-bottom: 10px; color: #f1c40f; }
        .instruksi { font-size: 14px; color: #bdc3c7; margin-bottom: 30px; }
        .game-area {
            position: relative; width: 100%; max-width: 500px; height: 300px;
            background: #34495e; border: 4px solid #7f8c8d; border-radius: 10px; margin-bottom: 20px;
        }
        .sampah { position: absolute; bottom: 20px; left: 50px; font-size: 45px; cursor: pointer; transition: all 0.5s ease-in-out; user-select: none; }
        .tong-sampah { position: absolute; bottom: 20px; right: 50px; font-size: 55px; transition: all 0.5s ease-in-out; }
        .btn-lempar {
            background: #e74c3c; color: white; border: none; padding: 12px 40px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s;
        }
        .btn-lempar:hover { background: #c0392b; }
        .btn-lempar:active { transform: scale(0.95); }
        .notifikasi {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9); padding: 20px 40px; border-radius: 15px;
            font-size: 22px; font-weight: bold; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid #fff;
        }
        .notifikasi.muncul { transform: translate(-50%, -50%) scale(1); }
        .sukses { color: #2ecc71; border-color: #2ecc71; }
        .gagal { color: #e74c3c; border-color: #e74c3c; }
    </style>
</head>
<body>

    <h1>Simulasi Buang Sampah Akurat 🗑️</h1>
    <p class="instruksi">Klik tombol di bawah untuk melempar sampah tepat ke sasaran!</p>

    <div class="game-area">
        <div id="itemSampah" class="sampah">🍎</div>
        <div id="itemTong" class="tong-sampah">🗑️</div>
    </div>

    <button id="tombolLempar" class="btn-lempar" onclick="mulaiSimulasi()">LEMPAR!</button>
    <div id="kotakNotif" class="notifikasi"></div>

    <script>
        const sampah = document.getElementById('itemSampah');
        const tong = document.getElementById('itemTong');
        const notif = document.getElementById('kotakNotif');
        const tombol = document.getElementById('tombolLempar');

        const kejadianGagal = [
            { teks: "Gagal! Tiba-tiba ada badai pasir dari antah berantah! 🌪️", aksi: () => sampah.style.transform = "translate(100px, -200px) rotate(720deg)" },
            { teks: "Gagal! Tong sampahnya tiba-tiba punya sayap dan terbang! 🕊️", aksi: () => tong.style.transform = "translateY(-150px)" },
            { teks: "Gagal! Gravitasi bumi mendadak hilang, sampah melayang ke atas! 🚀", aksi: () => sampah.style.transform = "translateY(-250px)" },
            { teks: "Gagal! Ada kucing oren lewat dan menggeser tong sampahnya! 🐈", aksi: () => tong.style.transform = "translateX(80px)" },
            { teks: "Gagal! Lemparan terlalu kuat, sampahnya menembus atmosfer! 🌠", aksi: () => sampah.style.transform = "translate(400px, -300px)" },
            { teks: "Gagal! Mendadak muncul portal gaib yang memindahkan sampah! 🌀", aksi: () => sampah.style.opacity = "0" },
            { teks: "Gagal! Angin sepoi-sepoi tapi kok niupnya kencang banget? 💨", aksi: () => sampah.style.transform = "translate(-50px, -50px)" },
            { teks: "Gagal! Tong sampahnya mendadak disambar petir dan hancur! ⚡", aksi: () => tong.innerHTML = "💥" },
            { teks: "Gagal! Tangan kamu tiba-tiba kram saat melempar! 🖐️", aksi: () => sampah.style.transform = "translateY(10px)" },
            { teks: "Gagal! Sampahnya malah berubah jadi burung lalu terbang kabur! 🐦", aksi: () => { sampah.innerHTML = "🐦"; sampah.style.transform = "translate(-100px, -200px)"; } },
            { teks: "Gagal! Bumi berputar terlalu cepat, tongnya geser sendiri! 🌍", aksi: () => tong.style.transform = "translateX(-150px)" },
            { teks: "Gagal! Tikus got mendadak muncul dan menangkap sampahmu! 🐀", aksi: () => sampah.style.transform = "translate(150px, 20px)" }
        ];

        function resetGame() {
            sampah.style.transform = "none"; sampah.style.opacity = "1"; sampah.innerHTML = "🍎";
            tong.style.transform = "none"; tong.innerHTML = "🗑️";
            notif.className = "notifikasi"; tombol.disabled = false;
        }

        function mulaiSimulasi() {
            tombol.disabled = true;
            sampah.style.transform = "translate(130px, -120px) rotate(180deg)";

            setTimeout(() => {
                const angkaKeberuntungan = Math.floor(Math.random() * 100) + 1;

                if (angkaKeberuntungan <= 7) {
                    sampah.style.transform = "translate(290px, 0px) rotate(360deg)";
                    setTimeout(() => {
                        sampah.style.opacity = "0";
                        notif.innerText = "CONGRATULATIONS!";
                        notif.className = "notifikasi muncul sukses";
                        setTimeout(resetGame, 3000);
                    }, 400);
                } else {
                    const indexGagal = Math.floor(Math.random() * kejadianGagal.length);
                    const kejadian = kejadianGagal[indexGagal];
                    kejadian.aksi();
                    notif.innerText = kejadian.teks;
                    notif.className = "notifikasi muncul gagal";
                    setTimeout(resetGame, 3500);
                }
            }, 500);
        }
    </script>
</body>
</html>
