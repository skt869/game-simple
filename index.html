<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test aim - skt X gmn Ultimate Skill Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; text-align: center;
            user-select: none;
        }
        
        .judul-utama { font-size: 28px; margin-bottom: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .judul-utama span { color: #f1c40f; font-weight: 900; letter-spacing: 1px; }
        .instruksi { font-size: 14px; color: #bdc3c7; margin-bottom: 15px; }
        
        /* Papan Skor */
        .papan-skor {
            display: flex; gap: 20px; margin-bottom: 15px; font-size: 16px; font-weight: bold;
            background: rgba(0,0,0,0.2); padding: 8px 20px; border-radius: 20px;
        }
        .skor-angka { color: #2ecc71; }
        .highscore-angka { color: #f1c40f; }

        /* Area Game Kantor */
        .game-area {
            position: relative; width: 100%; max-width: 600px; height: 350px;
            background: linear-gradient(to bottom, 
                #d2b48c 0%, #e6d7c3 70%, 
                #8b5a2b 70%, #a0522d 72%, 
                #cd853f 72%, #deb887 100%
            );
            border: 6px solid #5c3a21; border-radius: 12px; margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); overflow: hidden;
        }

        /* Detail Background Jendela dengan Pohon Besar & Latar Hijau */
        .game-area::before {
            content: "🌳";
            font-size: 55px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 2px;
            position: absolute;
            top: 30px;
            left: 40px;
            width: 80px;
            height: 100px;
            background: #27ae60;
            border: 3px solid #fff;
            border-radius: 4px;
            opacity: 0.8;
            pointer-events: none;
        }

        /* Detail Background Pajangan Dinding */
        .game-area::after {
            content: "🖼️"; position: absolute; top: 40px; right: 60px;
            font-size: 30px; opacity: 0.35; pointer-events: none;
        }
        
        /* Elemen Utama */
        .sampah { 
            position: absolute; bottom: 35px; left: 60px; font-size: 45px; 
            z-index: 10; transform-origin: center;
        }
        .tong-sampah { position: absolute; bottom: 35px; right: 70px; font-size: 55px; z-index: 5; }
        
        /* Garis Bidik */
        .aim-line {
            position: absolute; bottom: 60px; left: 85px;
            width: 120px; height: 3px; border-top: 3px dashed #e74c3c;
            transform-origin: left center; transform: rotate(-45deg);
            z-index: 2; pointer-events: none;
        }

        /* Elemen Efek Gangguan */
        .efek-gangguan {
            position: absolute; font-size: 70px; opacity: 0; z-index: 15;
            transition: all 0.4s ease-out; pointer-events: none;
        }

        /* Tombol Kontrol */
        .btn-lempar {
            background: #2ecc71; color: white; border: none; padding: 15px 50px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s;
        }
        .btn-lempar:hover { background: #27ae60; }
        .btn-lempar:active { transform: scale(0.95); }

        /* Pop-up Pesan */
        .notifikasi {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9); padding: 20px 40px; border-radius: 15px;
            font-size: 22px; font-weight: bold; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid #fff;
        }
        .notifikasi.muncul { transform: translate(-50%, -50%) scale(1); }
        .sukses { color: #2ecc71; border-color: #2ecc71; }
        .perfect { color: #f1c40f; border-color: #f1c40f; }
        .gagal { color: #e74c3c; border-color: #e74c3c; }
    </style>
</head>
<body>

    <h1 class="judul-utama">Tes Aim Buang Sampah Lu [ <span>skt X gmn</span> ] 🎯</h1>
    <p class="instruksi">Incar sudut tengah untuk PERFECT HIT (100% Masuk) </p>

    <div class="papan-skor">
        <div>Skor Saat Ini: <span id="skorSekarang" class="skor-angka">0</span></div>
        <div>Skor Tertinggi: <span id="skorTertinggi" class="highscore-angka">0</span></div>
    </div>

    <div class="game-area">
        <div id="aimLine" class="aim-line"></div>
        <div id="itemSampah" class="sampah">🍎</div>
        <div id="itemTong" class="tong-sampah">🗑️</div>
        <div id="efekVisual" class="efek-gangguan"></div>
    </div>

    <button id="tombolLempar" class="btn-lempar" onclick="tembakSampah()">LEMPAR SEKARANG!</button>
    <div id="kotakNotif" class="notifikasi"></div>

    <script>
        const sampah = document.getElementById('itemSampah');
        const tong = document.getElementById('itemTong');
        const aimLine = document.getElementById('aimLine');
        const tombol = document.getElementById('tombolLempar');
        const notif = document.getElementById('kotakNotif');
        const efekVisual = document.getElementById('efekVisual');
        
        const uiSkor = document.getElementById('skorSekarang');
        const uiHighScore = document.getElementById('skorTertinggi');

        let sudutSekarang = -10; let arahGerak = -2.5; let animasiBidikan; let sedangBermain = true;
        let skor = 0;
        let gagalBeruntun = 0; 
        let highScore = localStorage.getItem('skt_gmn_highscore') ? parseInt(localStorage.getItem('skt_gmn_highscore')) : 0;
        
        uiHighScore.innerText = highScore;

        // --- SISTEM SUARA (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'tick') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'woosh') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'sine'; o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                    g.gain.setValueAtTime(0.1, audioCtx.currentTime + index * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + index * 0.1); o.stop(audioCtx.currentTime + index * 0.1 + 0.3);
                });
            } else if (type === 'perfect') {
                const perfectNotes = [587.33, 739.99, 880.00, 1174.66];
                perfectNotes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'triangle'; o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.07);
                    g.gain.setValueAtTime(0.12, audioCtx.currentTime + index * 0.07);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.07 + 0.4);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + index * 0.07); o.stop(audioCtx.currentTime + index * 0.07 + 0.4);
                });
            } else if (type === 'fail') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
                osc.start(); osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        let frameCounter = 0;
        function gerakkanAim() {
            if (!sedangBermain) return;
            sudutSekarang += arahGerak;
            if (sudutSekarang <= -80 || sudutSekarang >= -10) { arahGerak = -arahGerak; }
            aimLine.style.transform = `rotate(${sudutSekarang}deg)`;
            
            frameCounter++;
            if (frameCounter % 15 === 0) { playSound('tick'); }

            animasiBidikan = requestAnimationFrame(gerakkanAim);
        }
        gerakkanAim();

        const kejadianGagal = [
            { 
                teks: "Gagal! Tiba-tiba ada badai pasir menyapu apelmu! 🌪️", 
                animasi: () => {
                    efekVisual.innerHTML = "🌪️"; efekVisual.style.left = "150px"; efekVisual.style.top = "80px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { sampah.style.transform = "translate(120px, -240px) rotate(540deg) scale(0.5)"; }, 100);
                }
            },
            { teks: "Gagal! Tong sampahnya mendadak kabur terbang! 🕊️", animasi: () => { tong.style.transform = "translateY(-170px) rotate(-15deg)"; } },
            { teks: "Gagal! Gravitasi hilang, apel melayang bebas! 🚀", animasi: () => { sampah.style.transform = "translate(180px, -260px)"; } },
            { 
                teks: "Gagal! Kucing oren menerkam tong sampah! 🐈", 
                animasi: () => {
                    efekVisual.innerHTML = "🐈"; efekVisual.style.right = "-40px"; efekVisual.style.bottom = "35px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { efekVisual.style.right = "140px"; tong.style.transform = "translateX(90px)"; }, 50);
                }
            },
            { teks: "Gagal! Lemparan terlalu kuat menembus atap! 🌠", animasi: () => { sampah.style.transform = "translate(300px, -330px) scale(0.1)"; } },
            { 
                teks: "Gagal! Apel terhisap masuk ke dalam portal gaib! 🌀", 
                animasi: () => {
                    efekVisual.innerHTML = "🌀"; efekVisual.style.left = "210px"; efekVisual.style.top = "120px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { sampah.style.transform = "translate(180px, -160px) scale(0)"; }, 150);
                }
            },
            { 
                teks: "Gagal! Hembusan angin kencang meniup balik apelnya! 💨", 
                animasi: () => {
                    efekVisual.innerHTML = "💨"; efekVisual.style.left = "260px"; efekVisual.style.top = "100px"; efekVisual.style.opacity = "1";
                    sampah.style.transform = "translate(80px, -100px)";
                }
            },
            { 
                teks: "Gagal! Petir menyambar menghancurkan tong sampah! ⚡", 
                animasi: () => {
                    efekVisual.innerHTML = "⚡"; efekVisual.style.right = "85px"; efekVisual.style.top = "60px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { tong.innerHTML = "💥"; efekVisual.style.opacity = "0"; }, 250);
                }
            },
            { teks: "Gagal! Tangan mendadak kram, apel jatuh lemas! 🖐️", animasi: () => { sampah.style.transform = "translate(40px, 15px) rotate(90deg)"; } },
            { 
                teks: "Gagal! Apelnya mendadak hidup menjadi burung lalu kabur! 🐦", 
                animasi: () => { setTimeout(() => { sampah.innerHTML = "🐦"; sampah.style.transform = "translate(120px, -250px) scaleX(-1)"; }, 200); }
            },
            { teks: "Gagal! Guncangan bumi membuat tong bergeser jauh! 🌍", animasi: () => { tong.style.transform = "translateX(-180px)"; } },
            { 
                teks: "Gagal! Tikus kantor melompat dan mencuri apelmu! 🐀", 
                animasi: () => {
                    efekVisual.innerHTML = "🐀"; efekVisual.style.left = "220px"; efekVisual.style.bottom = "-50px"; efekVisual.style.opacity = "1";
                    setTimeout(() => { efekVisual.style.bottom = "120px"; sampah.style.transform = "translate(180px, -160px) scale(0)"; }, 150);
                }
            }
        ];

        function resetGame() {
            sampah.style.transition = "none"; sampah.style.transform = "none"; sampah.style.opacity = "1"; sampah.innerHTML = "🍎";
            tong.style.transform = "none"; tong.innerHTML = "🗑️";
            efekVisual.style.transition = "none"; efekVisual.style.opacity = "0"; efekVisual.style.transform = "none";
            notif.className = "notifikasi"; 
            sedangBermain = true; aimLine.style.opacity = "1"; tombol.disabled = false;
            gerakkanAim();
        }

        function prosesKemenangan(isPerfect) {
            if (isPerfect) {
                playSound('perfect');
                notif.innerText = "⭐ PERFECT SKILL HIT! 100% SUCCESS! ⭐";
                notif.className = "notifikasi muncul perfect";
            } else {
                playSound('win');
                notif.innerText = "CONGRATULATIONS! (7% Luck)";
                notif.className = "notifikasi muncul sukses";
            }

            skor += 1;
            uiSkor.innerText = skor;

            if (skor > highScore) {
                highScore = skor;
                localStorage.setItem('skt_gmn_highscore', highScore);
                uiHighScore.innerText = highScore;
            }

            sampah.style.transform = "translate(390px, 0px) rotate(360deg)";
            setTimeout(() => {
                sampah.style.opacity = "0";
                setTimeout(resetGame, 3000);
            }, 400);
        }

        function tembakSampah() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            sedangBermain = false;
            cancelAnimationFrame(animasiBidikan);
            tombol.disabled = true;
            aimLine.style.opacity = "0";
            
            playSound('woosh');
            
            sampah.style.transition = "all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
            sampah.style.transform = "translate(180px, -160px) rotate(180deg)";

            setTimeout(() => {
                // --- KONDISI 1: MEKANIK MURNI SKILL ---
                if (sudutSekarang <= -35 && sudutSekarang >= -37) {
                    gagalBeruntun = 0;
                    prosesKemenangan(true);
                    return;
                }

                // --- KONDISI 2: JALUR HOKI ACAK (7%) ---
                const angkaKeberuntungan = Math.floor(Math.random() * 100) + 1;

                if (angkaKeberuntungan <= 7) {
                    gagalBeruntun = 0;
                    prosesKemenangan(false);
                } else {
                    // --- JALUR GAGAL ---
                    playSound('fail');
                    skor = 0;
                    uiSkor.innerText = skor;
                    
                    gagalBeruntun += 1;

                    // CEK EASTER EGG (Gagal 7 Kali Beruntun)
                    if (gagalBeruntun === 7) {
                        gagalBeruntun = 0;
                        sampah.style.transition = "all 0.4s ease-out";
                        sampah.style.transform = "scale(0)";
                        
                        setTimeout(() => {
                            notif.innerText = "Udah 7 kali gagal cupu banget sih! 🤪🤫";
                            notif.className = "notifikasi muncul gagal";
                            setTimeout(resetGame, 4500);
                        }, 350);
                        return;
                    }

                    // GAGAL BIASA
                    const indexGagal = Math.floor(Math.random() * kejadianGagal.length);
                    const kejadian = kejadianGagal[indexGagal];
                    
                    sampah.style.transition = "all 0.4s ease-out";
                    efekVisual.style.transition = "all 0.4s ease-out";
                    
                    kejadian.animasi();
                    
                    setTimeout(() => {
                        notif.innerText = kejadian.teks;
                        notif.className = "notifikasi muncul gagal";
                        setTimeout(resetGame, 3800);
                    }, 350);
                }
            }, 450);
        }
    </script>
</body>
</html>
